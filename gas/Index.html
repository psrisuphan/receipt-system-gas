<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><?= storeName ?> — Operations Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap');
  :root{
    --shell:#2b3035; --shell-2:#363d43; --shell-3:#424b52; --shell-border:#4d575e;
    --bg:#f1f3f5; --surface:#ffffff; --surface-2:#f7f8fa; --border:#d5dbe2; --border-2:#bdc6d0;
    --text:#273037; --muted:#667077; --muted-2:#929ba2;
    --primary:#267565; --primary-2:#1f6254; --primary-soft:#e8f2ef;
    --highlight:#c78956;
    --ok:#287a57; --ok-soft:#eaf5ef; --danger:#b9382f; --danger-soft:#fdf0ef; --warn:#99621a; --warn-soft:#fbf5e9;
    --radius:4px; --radius-lg:4px; --shadow:none; --shadow-lg:0 4px 12px rgba(16,24,40,.12);
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter','Bai Jamjuree',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  /* Shell bar - SAP Fiori style */
  .shellbar{height:48px;background:var(--shell);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:0;z-index:30;border-bottom:1px solid var(--shell-border)}
  .shellbar-brand{display:flex;align-items:center;gap:12px;min-width:240px}
  .shellbar-logo{width:32px;height:32px;border-radius:3px;background:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;position:relative;overflow:hidden}
  .shellbar-logo::after{content:'';position:absolute;right:0;top:0;width:7px;height:7px;background:var(--highlight)}
  .shellbar-brand h1{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1}
  .shellbar-brand p{margin:2px 0 0;font-size:11px;color:#b7c0c5;font-weight:400}
  .shellbar-search{flex:1;max-width:520px;position:relative}
  .shellbar-search input{width:100%;background:var(--shell-2);border:1px solid var(--shell-border);color:#e2e8f0;padding:8px 80px 8px 12px;border-radius:4px;font-size:13px}
  .shellbar-search input::placeholder{color:#a6b0b7}
  .shellbar-search input:focus{outline:none;background:var(--shell-3);border-color:#719f95;color:#fff}
  .shellbar-search::before{display:none}
  .shellbar-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--shell-3);border:1px solid var(--shell-border);color:#b1bdc2;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
  .shellbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .shellbar-icon{width:32px;height:32px;border-radius:4px;background:transparent;border:1px solid transparent;display:grid;place-items:center;color:#b7c0c5;font-size:12px}
  .shellbar-icon:hover{background:var(--shell-2);border-color:var(--shell-border);color:#fff}
   .shellbar-user{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;background:var(--shell-2);border:1px solid var(--shell-border);border-radius:4px}
   .shellbar-avatar{width:28px;height:28px;border-radius:4px;background:var(--primary);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  .shellbar-user strong{font-size:12px;font-weight:600}
  .shellbar-user span{font-size:11px;color:#b7c0c5}
  /* App layout */
  .app{display:flex;min-height:calc(100vh - 48px)}
  .sidebar{width:224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:48px;height:calc(100vh - 48px);overflow:hidden}
  .sidebar-scroll{flex:1;overflow:auto;padding:12px 10px}
  .nav-group{margin:16px 0 6px;padding:0 8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
  .nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid transparent}
  .nav-link:hover{background:var(--surface-2);color:var(--text);border-color:transparent}
  .nav-link.active{background:var(--primary-soft);color:var(--text);border-color:transparent;font-weight:600}
  .nav-count{margin-left:auto;font-size:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);padding:1px 6px;border-radius:4px;font-family:var(--mono)}
  .nav-link.active .nav-count{background:#fff;border-color:#bfd8d1;color:var(--primary)}
  .main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column}
  .content{max-width:1320px;width:100%;flex:1;margin:0 auto;padding:20px 24px 64px}
  /* Page header */
  .page-header{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--primary);margin:-20px -24px 20px;padding:15px 24px 16px}
  .page-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .page-header h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .page-header p{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .breadcrumb{font-size:11px;color:var(--muted-2);display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .breadcrumb a{color:var(--muted)}
  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
  .card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface)}
  .card-head h3{margin:0;font-size:13px;font-weight:600;letter-spacing:-.01em}
  .card-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .card-pad{padding:16px}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .kpi{padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-height:112px}
  .kpi-head{display:flex;align-items:center;justify-content:space-between}
  .kpi-head label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .kpi strong{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .kpi small{font-size:11px;color:var(--muted)}
  .kpi:first-child{border-top:2px solid var(--primary)}
  .kpi:hover{border-color:#a9c9c1;box-shadow:0 2px 6px rgba(38,117,101,.1);transform:translateY(-1px);transition:.15s}
  /* Table - SAP style */
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
  td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  tbody tr:hover{background:#f8fafc}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;border:1px solid var(--border)}
  .pill-dot{width:6px;height:6px;border-radius:50%}
  .pill-ok{background:var(--ok-soft);color:var(--ok);border-color:#a7f3d0}
  .pill-ok .pill-dot{background:var(--ok)}
  .pill-cancel{background:var(--danger-soft);color:var(--danger);border-color:#fecaca}
  .pill-cancel .pill-dot{background:var(--danger)}
  .btn{padding:7px 12px;border-radius:4px;border:1px solid transparent;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-2)}
  .btn-sec{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn-sec:hover{background:var(--surface-2)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn:active{transform:translateY(1px)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:600;color:var(--text)}
  .field input,.field select,.field textarea{padding:8px 11px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:13px;line-height:1.4}
  .field input,.field select{height:36px}
  .field textarea{min-height:72px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .field-hint{font-size:11px;color:var(--muted)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .divider{height:1px;background:var(--border);margin:10px 0}
  .muted{color:var(--muted)}
  .error{background:var(--danger-soft);border:1px solid #fecaca;color:var(--danger);padding:10px 12px;border-radius:4px;font-size:13px}
  .success{background:var(--ok-soft);border:1px solid #a7f3d0;color:var(--ok);padding:10px 12px;border-radius:4px;font-size:13px}
  .empty{padding:32px 16px;text-align:center;color:var(--muted)}
  .hidden{display:none !important}
  .receipt{max-width:360px;margin:0 auto;background:#fff;padding:22px;border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow)}
  .control-note{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);line-height:1.5}
  .control-note strong{color:var(--text);font-weight:600;white-space:nowrap}
  .policy-note{border-left:3px solid var(--primary)}
  #app input,#app select,#app textarea{border-radius:4px !important}
  #app [style*="border-radius:8px"]{border-radius:4px !important}
  .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.9fr);gap:16px;margin-bottom:16px}
  .chart-area{height:246px;padding:12px 16px}
  .chart-empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .category-list{display:flex;flex-direction:column;gap:14px}
  .category-row{display:grid;gap:6px}
  .category-label{display:flex;justify-content:space-between;gap:12px;font-size:13px}
  .category-label span{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .category-meter{height:5px;background:#e8edf1;overflow:hidden}
  .category-meter span{display:block;height:100%;background:var(--primary)}
  .table-action{white-space:nowrap}
  .section-eyebrow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .section-eyebrow::after{content:'';flex:1;height:1px;background:var(--border)}
  .statusbar{height:32px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-top:1px solid var(--shell-border);background:var(--shell);color:#b7c0c5;font-size:11px;position:fixed;right:0;bottom:0;left:0;z-index:40}
  .statusbar-left{display:flex;align-items:center;gap:10px;min-width:0}
  .statusbar-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .status-separator{color:#6a7780}
  .statusbar time{color:#fff;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .statusbar .shellbar-user{padding:2px 8px 2px 2px}
  .statusbar .shellbar-avatar{width:22px;height:22px;font-size:10px}
  .menu-toggle{display:none}
  .mono{font-family:var(--mono)}
  @media(max-width:1024px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} .form-grid{grid-template-columns:1fr} }
  @media(max-width:720px){
    .sidebar{position:fixed;inset:48px 0 0 0;transform:translateX(-100%);transition:.2s;z-index:20}
    .sidebar.open{transform:none}
    .shellbar-search{display:none}
    .menu-toggle{display:grid}
    .shellbar-brand{min-width:0}
    .shellbar-user>div:last-child{display:none}
    .page-header-top{flex-direction:column}
    .page-header{margin:-14px -14px 14px;padding:14px}
    #app > div[style*="grid-template-columns"]{grid-template-columns:1fr !important}
    #app .card-pad[style*="grid-template-columns"],#app .form-grid[style*="grid-template-columns"]{grid-template-columns:1fr !important}
    #app .kpi-grid{grid-template-columns:1fr 1fr !important}
    #lines > div,#e_lines > div{grid-template-columns:1fr 1fr !important}
    #lines > div select,#e_lines > div select{grid-column:1 / -1}
    #lines > div span,#e_lines > div span{text-align:left !important}
    #app .card[style*="position:sticky"]{position:static !important}
    #app .table-wrap table{min-width:600px}
    .dashboard-grid{grid-template-columns:1fr}
    .content{padding:14px 14px 50px}
    .statusbar{left:0;padding:0 14px}
    .kpi-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<header class="shellbar">
  <div class="shellbar-brand">
    <div class="shellbar-logo"><?= storeName.charAt(0).toUpperCase() ?></div>
    <div>
      <h1><?= storeName ?></h1>
      <p>Operations Console</p>
    </div>
  </div>
  <div class="shellbar-search"><input id="globalSearch" aria-label="Search receipts or customers" placeholder="Search receipts or customers…"><span class="shellbar-kbd">⌘K</span></div>
  <div class="shellbar-actions">
    <a class="btn btn-primary btn-sm" href="#new">New receipt</a>
    <button class="shellbar-icon menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')" title="Menu" aria-label="Open menu">Menu</button>
  </div>
</header>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="nav-group">Overview</div>
      <a class="nav-link" href="#dashboard" data-route="dashboard">Dashboard <span class="nav-count" id="navDashCount">—</span></a>
      <a class="nav-link" href="#new" data-route="new">New receipt</a>
      <div class="nav-group">Manage</div>
      <a class="nav-link" href="#history" data-route="history">Receipt History <span class="nav-count" id="navHistCount">—</span></a>
      <a class="nav-link" href="#customers" data-route="customers">Customers <span class="nav-count" id="navCustCount">—</span></a>
      <a class="nav-link" href="#services" data-route="services">Catalog <span class="nav-count" id="navSvcCount">—</span></a>
      <div class="nav-group">Control</div>
      <a class="nav-link" href="#audit" data-route="audit">Audit log</a>
      <a class="nav-link" href="#settings" data-route="settings">Settings</a>
    </div>
  </aside>
  <main class="main">
    <div class="content" id="app">กำลังโหลด…</div>
  </main>
</div>
<footer class="statusbar" aria-label="System status">
  <div class="statusbar-left">
    <div class="shellbar-user">
      <div class="shellbar-avatar" id="actorAvatar">—</div>
      <div style="line-height:1"><strong id="actorName" style="font-size:12px">—</strong> <span id="actorEmail" style="font-size:11px;color:#b7c0c5">—</span></div>
    </div>
  </div>
  <div class="statusbar-right">
    <span class="status-label">Local time · Asia/Bangkok</span>
    <span class="status-separator" aria-hidden="true">|</span>
    <time id="clock" aria-live="polite">--:--:--</time>
  </div>
</footer>

<script>
let STATE={customers:[], categories:[], services:[], purchases:[], items:[], ledger:[], evidence:[], audit:[], balances:{}, store_name:'STORE', receipt_footer:''};
let FILTER={q:'', status:'', customer:''};

function money(n){ return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB'}).format(Number(n||0)); }
function dt(iso){ try{ return new Date(iso).toLocaleString('th-TH',{timeZone:'Asia/Bangkok', dateStyle:'medium', timeStyle:'short'});}catch(e){return iso} }
function call(name, ...args){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e.message||String(e)))[name](...args);
  });
}
async function refresh(){
  STATE = await call('apiGetInit');
  const email = STATE.actor.email || '';
  document.getElementById('actorEmail').textContent = email;
  document.getElementById('actorName').textContent = STATE.actor.name || email.split('@')[0] || '—';
  document.getElementById('actorAvatar').textContent = (STATE.actor.name||email||'—').charAt(0).toUpperCase();
  document.getElementById('navCustCount').textContent = STATE.customers.filter(c=>!c.archived_at).length;
  document.getElementById('navSvcCount').textContent = STATE.services.filter(s=>!s.archived_at).length;
  document.getElementById('navHistCount').textContent = STATE.purchases.length;
  document.getElementById('navDashCount').textContent = STATE.purchases.filter(p=>p.status==='completed').length;
  render();
}
function navActive(){
  const h=(location.hash.replace('#','')||'dashboard').split('/')[0];
  document.querySelectorAll('.sidebar .nav-link').forEach(a=>{
    const r=a.dataset.route;
    a.classList.toggle('active', r===h || (h==='customer' && r==='customers') || (h==='purchase' && r==='history') || (h==='receipt' && r==='history'));
  });
}
window.addEventListener('hashchange', ()=>{ navActive(); render(); });
document.getElementById('globalSearch').addEventListener('input', e=>{
  FILTER.q=e.target.value;
  if(location.hash.startsWith('#history') || location.hash.startsWith('#customers')) render();
  else { location.hash='#history'; }
});
document.addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('globalSearch').focus(); }});
function render(){
  navActive();
  const r=(location.hash.replace('#','')||'dashboard');
  const app=document.getElementById('app');
  try{
    if(r==='dashboard') app.innerHTML=viewDashboard();
    else if(r==='new') app.innerHTML=viewNew();
    else if(r==='history') app.innerHTML=viewHistory();
    else if(r==='customers') app.innerHTML=viewCustomers();
    else if(r.startsWith('customer/')) app.innerHTML=viewCustomerDetail(r.split('/')[1]);
    else if(r==='services') app.innerHTML=viewServices();
    else if(r.startsWith('purchase/')) app.innerHTML=viewPurchase(r.split('/')[1]);
    else if(r.startsWith('receipt/')) app.innerHTML=viewReceipt(r.split('/')[1]);
    else if(r==='audit') app.innerHTML=viewAudit();
    else if(r==='settings') app.innerHTML=viewSettings();
    else app.innerHTML='\x3cdiv class="card card-pad">Not found\x3c/div>';
    afterRender(r);
  }catch(e){ app.innerHTML='\x3cdiv class="error">'+e+'\x3c/div>'; }
}
function afterRender(route){
  if(route==='new') bindNew();
  if(route==='customers') bindCustomers();
  if(route==='services') bindServices();
  if(route==='settings') bindSettings();
  if(route==='dashboard') bindDashboard();
}

// --- dashboard - SAP Fiori + modern chart ---
function viewDashboard(){
  const completed=STATE.purchases.filter(p=>p.status==='completed');
  const cancelled=STATE.purchases.filter(p=>p.status==='cancelled');
  const total=completed.reduce((s,p)=>s+Number(p.total_amount||0),0);
  const avg = completed.length ? total/completed.length : 0;
  const mTotal = completed.filter(p=> new Date(p.purchase_at).getMonth()===new Date().getMonth()).reduce((s,p)=>s+Number(p.total_amount||0),0);
  const pointsIssued=STATE.ledger.filter(l=>Number(l.points_delta)>0).reduce((s,l)=>s+Number(l.points_delta),0);
  const pointsRedeemed=Math.abs(STATE.ledger.filter(l=>Number(l.points_delta)<0).reduce((s,l)=>s+Number(l.points_delta),0));
  const byCat={}; STATE.items.forEach(it=>{
    const pur=STATE.purchases.find(x=>String(x.id)===String(it.purchase_id) && x.status==='completed');
    if(!pur) return; byCat[it.category_name]=(byCat[it.category_name]||0)+Number(it.line_total||0);
  });
  const topCats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);
  return `
  \x3cdiv class="page-header">
    \x3cdiv class="page-header-top">
      \x3cdiv>
        \x3cdiv class="breadcrumb">\x3ca href="#dashboard">Home\x3c/a> › Dashboard\x3c/div>
        \x3ch1>Dashboard \x3cspan style="font-weight:400;color:var(--muted);font-size:13px">· ${STATE.store_name}\x3c/span>\x3c/h1>
        \x3cp>Sales, loyalty, and audit overview · Asia/Bangkok\x3c/p>
      \x3c/div>
        \x3cdiv class="row">\x3ca class="btn btn-sec btn-sm" href="#history">View receipts\x3c/a>\x3c/div>
    \x3c/div>
  \x3c/div>
  \x3cdiv class="kpi-grid">
    \x3cdiv class="card kpi active">\x3cdiv class="kpi-head">\x3clabel>Total Sales\x3c/label>\x3cspan class="kpi-icon primary">◈\x3c/span>\x3c/div>\x3cstrong>${money(total)}\x3c/strong>\x3cdiv class="row" style="justify-content:space-between">\x3csmall>${completed.length} posted · avg ${money(avg)}\x3c/small>\x3cspan class="trend up">↗ ${mTotal?'+'+Math.round(mTotal/total*100)+'% MTD':''}\x3c/span>\x3c/div>\x3c/div>

function bindDashboard(){
  const completed=STATE.purchases.filter(p=>p.status==='completed');
  const byMonth={}; completed.forEach(p=>{ const k=new Date(p.purchase_at).toISOString().slice(0,7); byMonth[k]=(byMonth[k]||0)+Number(p.total_amount||0); });
  const months=Object.keys(byMonth).sort().slice(-6);
  const values=months.map(m=>byMonth[m]);
  if(typeof Chart !== 'undefined' && months.length){
    new Chart(canvas, {
      type:'bar',
      data:{ labels: months, datasets:[
        { label:'Posted', data: values, backgroundColor:'#0f62fe', borderRadius:6, barPercentage:0.5 },
        { label:'Avg', data: months.map(()=> values.length? values.reduce((a,b)=>a+b,0)/values.length : 0), type:'line', borderColor:'#94a3b8', borderDash:[4,4], pointRadius:0, tension:.3 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:true, position:'bottom', labels:{boxWidth:12, font:{size:11}}} }, scales:{ y:{ beginAtZero:true, grid:{color:'#f1f5f9'} }, x:{ grid:{display:false} } } }
    });
    const topCats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);
    if(typeof Chart !== 'undefined' && topCats.length){
      new Chart(catCanvas, {
        type:'pie',
        data:{ labels: topCats.map(x=>x[0]), datasets:[{ data: topCats.map(x=>x[1]), backgroundColor:['#267565','#c78956','#287a57','#99621a'], borderWidth:1, borderColor:'#fff' }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=> c.label + ': ' + money(c.parsed) } } } }
      });
    }
  }
}

function bindNew(){
  const linesEl=document.getElementById('lines');
  const svcMap={}; STATE.services.forEach(s=> svcMap[s.id]=s);
  const catMap={}; STATE.categories.forEach(c=> catMap[c.id]=c);
  let lines=[{service_id:'', quantity:1, unit_price:0}];
  function renderLines(){
    linesEl.innerHTML=lines.map((l,i)=> `
      \x3cdiv style="display:grid;grid-template-columns:1.6fr 72px 108px 88px 32px;gap:8px;align-items:center;margin:8px 0">
        \x3cselect data-i="${i}" class="svc" aria-label="Service ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">\x3coption value="">Service\x3c/option>${STATE.services.filter(s=>!s.archived_at).map(s=> `\x3coption value="${s.id}" ${s.id===l.service_id?'selected':''}>${(catMap[s.category_id]?.name||'')+' · '+s.name}\x3c/option>`).join('')}\x3c/select>
        \x3cinput type="number" min="1" step="1" value="${l.quantity}" data-i="${i}" class="qty" aria-label="Quantity for line ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">
        \x3cinput type="number" min="0" step="0.01" value="${l.unit_price}" data-i="${i}" class="price" aria-label="Unit price for line ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">
        \x3cspan style="text-align:right;font-weight:700;font-size:13px;font-family:var(--mono)">${money(Number(l.quantity||0)*Number(l.unit_price||0))}\x3c/span>
        \x3cbutton class="btn btn-ghost btn-sm" data-del="${i}" aria-label="Remove line ${i+1}" title="Remove line ${i+1}" style="padding:6px">✕\x3c/button>
      \x3c/div>
    `).join('');
    calc();
  }
  function calc(){
    const redeem=(document.getElementById('n_redeem') && document.getElementById('n_redeem').checked);
    let sub=lines.reduce((s,l)=> s+Number(l.quantity||0)*Number(l.unit_price||0),0); sub=Math.round(sub*100)/100;
    const disc=redeem? Math.round(sub*0.08*100)/100:0; const total=Math.round((sub-disc)*100)/100;
    let pts=0; if(total<200) pts=0; else if(total<500) pts=2; else if(total<800) pts=4; else if(total<1000) pts=6; else pts=8;
    document.getElementById('totals').innerHTML=`
      \x3cdiv style="display:flex;justify-content:space-between;font-size:13px">\x3cspan>Subtotal\x3c/span>\x3cspan class="mono">${money(sub)}\x3c/span>\x3c/div>
      ${redeem ? `\x3cdiv style="display:flex;justify-content:space-between;font-size:13px;color:var(--ok)">\x3cspan>Discount 8%\x3c/span>\x3cspan>-${money(disc)}\x3c/span>\x3c/div>` : ''}
      \x3cdiv style="display:flex;justify-content:space-between;font-weight:700;margin-top:6px;font-size:14px">\x3cspan>Total\x3c/span>\x3cspan class="mono">${money(total)}\x3c/span>\x3c/div>
      \x3cdiv style="font-size:12px;color:var(--muted);margin-top:6px">Points to earn \x3cb style="color:var(--primary)">${pts}\x3c/b> ${redeem?`· redeem 8`:''}\x3c/div>
    `;
    document.getElementById('previewCard').innerHTML= lines.filter(l=>l.service_id).length ? lines.filter(l=>l.service_id).map(l=>{
      const svc=svcMap[l.service_id]; return `\x3cdiv style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)">\x3cspan>${svc?svc.name:''} × ${l.quantity}\x3c/span>\x3cspan class="mono">${money(Number(l.quantity)*Number(l.unit_price))}\x3c/span>\x3c/div>`;
    }).join('') + `\x3cdiv style="display:flex;justify-content:space-between;font-weight:700;margin-top:8px">\x3cspan>Total\x3c/span>\x3cspan class="mono">${money(total)}\x3c/span>\x3c/div>` : '\x3cspan class="muted">Select a service to preview\x3c/span>';
    document.getElementById('redeemHint').textContent = redeem ? '−8 pts' : '';
  }
  linesEl.addEventListener('change', e=>{
    const i=Number(e.target.dataset.i); if(isNaN(i)) return;
    if(e.target.classList.contains('svc')){ lines[i].service_id=e.target.value; const svc=svcMap[e.target.value]; if(svc) lines[i].unit_price=Number(svc.default_price); renderLines(); }
    if(e.target.classList.contains('qty')) lines[i].quantity=e.target.value;
    if(e.target.classList.contains('price')) lines[i].unit_price=e.target.value;
    calc();
  });
  linesEl.addEventListener('input', e=>{ const i=Number(e.target.dataset.i); if(isNaN(i)) return; if(e.target.classList.contains('qty')) lines[i].quantity=e.target.value; if(e.target.classList.contains('price')) lines[i].unit_price=e.target.value; calc(); });
  linesEl.addEventListener('click', e=>{ const d=e.target.dataset.del; if(d!=null){ lines.splice(Number(d),1); if(!lines.length) lines.push({service_id:'',quantity:1,unit_price:0}); renderLines(); } });
  document.getElementById('addLine').onclick=()=>{ lines.push({service_id:'',quantity:1,unit_price:0}); renderLines(); };
  document.getElementById('n_useNow').onchange=e=> document.getElementById('n_at').disabled=e.target.checked;
  document.getElementById('n_customer').onchange=e=>{
    const id=e.target.value; const bal=STATE.balances[id]||0;
    document.getElementById('custInfo').innerHTML = id? `Balance \x3cb>${bal}\x3c/b> ${bal>=8?'\x3cspan style="color:var(--ok);font-weight:700">· redeemable\x3c/span>':'\x3cspan class="muted">· need 8 pts\x3c/span>'}`: '';
    const cb=document.getElementById('n_redeem'); cb.disabled=bal<8; if(bal<8) cb.checked=false; calc();
  };
  document.getElementById('n_redeem').onchange=calc;
  document.getElementById('n_file').onchange=e=>{
    const f=e.target.files[0]; document.getElementById('n_fileHint').textContent = f ? f.name+' · '+(f.size/1024/1024).toFixed(2)+'MB' : '';
  };
  document.getElementById('nc_open').onclick=()=> document.getElementById('inlineCustomer').classList.remove('hidden');
  document.getElementById('nc_cancel').onclick=()=> document.getElementById('inlineCustomer').classList.add('hidden');
  document.getElementById('nc_save').onclick=async ()=>{
    try{
      const payload={name:document.getElementById('nc_name').value, line_id:document.getElementById('nc_line').value, x_account:document.getElementById('nc_x').value, notes:document.getElementById('nc_notes').value};
      const c=await call('apiCreateCustomer', payload);
      const select=document.getElementById('n_customer');
      const option=document.createElement('option');
      option.value=c.id; option.textContent=c.customer_code+' · '+c.name+' (0 pts)'; select.appendChild(option); select.value=c.id; select.dispatchEvent(new Event('change'));
      document.getElementById('inlineCustomer').classList.add('hidden');
    }catch(e){ alert(e); }
  };
  document.getElementById('savePurchase').onclick=async ()=>{
    const btn=document.getElementById('savePurchase'); btn.disabled=true; btn.textContent='Posting…';
    try{
      const customer_id=document.getElementById('n_customer').value; if(!customer_id) throw new Error('Select customer');
      const useNow=document.getElementById('n_useNow').checked;
      const at=document.getElementById('n_at').value;
      let purchase_at=null; if(!useNow){ if(!at) throw new Error('Posting date required'); purchase_at=at; }
      if(lines.some(l=>!l.service_id|| !Number.isInteger(Number(l.quantity))||Number(l.quantity)<=0||Number(l.unit_price)<0)) throw new Error('Check lines');
      const payload={customer_id, purchase_at, items: lines.map(l=>({service_id:l.service_id, quantity:Number(l.quantity), unit_price:Number(l.unit_price)})), redeem_points: document.getElementById('n_redeem').checked, note: document.getElementById('n_note').value.trim()};
      const res=await call('apiCreatePurchase', payload);
      const file=document.getElementById('n_file').files[0];
      if(file){
        const b64=await toBase64(file);
        await call('apiUploadEvidence', res.purchase_id, file.name, file.type, b64);
      }
      await refresh();
      location.hash='#receipt/'+res.purchase_id;
    }catch(e){ document.getElementById('newMsg').innerHTML=`\x3cdiv class="error">${e}\x3c/div>`; }
    btn.disabled=false; btn.textContent='Post receipt';
  };
  renderLines();
}
function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

function bindCustomers(){
  const body=document.getElementById('c_body'); const search=document.getElementById('c_search');
  function render(){
    const q=(search.value||'').toLowerCase();
    const rows=STATE.customers.filter(c=>!c.archived_at).filter(c=> !q || [c.name,c.customer_code,c.line_id,c.x_account].join(' ').toLowerCase().includes(q))
      .map(c=> `\x3ctr>\x3ctd class="mono" style="font-size:12px">${c.customer_code}\x3c/td>\x3ctd>\x3ca href="#customer/${c.id}" style="font-weight:600">${c.name}\x3c/a>\x3cdiv style="font-size:12px;color:var(--muted)">${c.notes||''}\x3c/div>\x3c/td>\x3ctd>\x3cdiv style="font-size:13px">${c.line_id||''}\x3c/div>\x3cdiv style="font-size:12px;color:var(--muted)">${c.x_account||''}\x3c/div>\x3c/td>\x3ctd style="text-align:center">\x3cspan class="pill" style="background:var(--surface-2)">${STATE.balances[c.id]||0}\x3c/span>\x3c/td>\x3ctd>\x3cdiv class="row" style="justify-content:flex-end">\x3cbutton class="btn btn-ghost btn-sm" data-edit="${c.id}">Edit\x3c/button>\x3cbutton class="btn btn-sec btn-sm" data-arch="${c.id}">Archive\x3c/button>\x3c/div>\x3c/td>\x3c/tr>`).join('');
    body.innerHTML=rows||'\x3ctr>\x3ctd colspan=5 class="empty">No customers\x3c/td>\x3c/tr>';
  }
  search.oninput=render; render();
  document.getElementById('c_add').onclick=async ()=>{
    try{
      const payload={name:document.getElementById('c_name').value, line_id:document.getElementById('c_line').value, x_account:document.getElementById('c_x').value, notes:document.getElementById('c_notes').value};
      await call('apiCreateCustomer', payload); await refresh(); document.getElementById('c_msg').innerHTML='\x3cdiv class="success">Created\x3c/div>';
    }catch(e){ document.getElementById('c_msg').innerHTML='\x3cdiv class="error">'+e+'\x3c/div>'; }
  };
  body.onclick=async e=>{
    if(e.target.dataset.arch){
       if(!confirm('Archive customer? Existing receipts remain.')) return;
      await call('apiArchiveCustomer', e.target.dataset.arch); await refresh();
    }
    if(e.target.dataset.edit){
      const c=STATE.customers.find(x=>String(x.id)===String(e.target.dataset.edit));
      const name=prompt('Name',c.name); if(name==null) return;
      const line_id=prompt('LINE',c.line_id||''); const x_account=prompt('X',c.x_account||'');
      try{ await call('apiUpdateCustomer', c.id, {name, line_id, x_account}); await refresh(); }catch(err){ alert(err); }
    }
  };
  document.getElementById('m_go').onclick=async ()=>{
    const p=document.getElementById('m_primary').value, d=document.getElementById('m_dup').value;
    if(!p||!d) return alert('Select both'); if(p===d) return alert('Different customers');
     if(!confirm('Merge — moves receipts and points to the primary customer')) return;
    await call('apiMergeCustomers', p, d); await refresh(); alert('Merged');
  };
}

async function adjustPoints(customerId){
  const id = customerId || (location.hash.split('/')[1]||'');
  const delta = document.getElementById('pa_delta') ? document.getElementById('pa_delta').value : '';
  const reason = document.getElementById('pa_reason') ? document.getElementById('pa_reason').value : '';
  const msg = document.getElementById('pa_msg');
  try{
    const res = await call('apiAdjustPoints', id, Number(delta), reason);
    if(msg) msg.innerHTML='\x3cspan class="success">Posted · balance '+res.points_balance+'\x3c/span>';
    await refresh(); render();
  }catch(e){ if(msg) msg.innerHTML='\x3cspan class="error">'+e+'\x3c/span>'; else alert(e); }
}

function afterPurchase(id){
  const p=STATE.purchases.find(x=>String(x.id)===String(id)); if(!p) return;
  const _btnCancel=document.getElementById('btnCancel'); if(_btnCancel) _btnCancel.addEventListener('click', async ()=>{
    const reason=prompt('Reason *'); if(!reason) return;
    if(!confirm('Cancel '+p.receipt_number+' ? Points will be reversed')) return;
    try{ await call('apiCancelPurchase', id, reason); await refresh(); location.hash='#purchase/'+id; }catch(e){alert(e)}
  });
  const box=document.getElementById('editBox');
  const _btnEdit=document.getElementById('btnEdit'); if(_btnEdit) _btnEdit.addEventListener('click', ()=> { box.style.display = box.style.display==='none' ? 'block' : 'none'; });
  const _eCancel=document.getElementById('e_cancel'); if(_eCancel) _eCancel.addEventListener('click', ()=> box.style.display='none');
  let items=STATE.items.filter(x=>String(x.purchase_id)===String(id)).map(it=> ({service_id:it.service_id, quantity:it.quantity, unit_price:it.unit_price}));
  if(!items.length) items=[{service_id:'',quantity:1,unit_price:0}];
  const linesEl=document.getElementById('e_lines');
  function renderE(){
    linesEl.innerHTML=items.map((l,i)=> `
      \x3cdiv style="display:grid;grid-template-columns:1.6fr 80px 110px 36px;gap:8px;align-items:center;margin:6px 0">
        \x3cselect data-i="${i}" class="e_svc" aria-label="Service ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">\x3coption value="">Service\x3c/option>${STATE.services.map(s=>{
          const cat=STATE.categories.find(c=>String(c.id)===String(s.category_id)); return `\x3coption value="${s.id}" ${s.id===l.service_id?'selected':''}>${cat?cat.name:''}·${s.name}\x3c/option>`;
        }).join('')}\x3c/select>
        \x3cinput type="number" data-i="${i}" class="e_qty" value="${l.quantity}" aria-label="Quantity for line ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">
        \x3cinput type="number" data-i="${i}" class="e_price" value="${l.unit_price}" aria-label="Unit price for line ${i+1}" style="padding:8px;border:1px solid var(--border);border-radius:8px">
        \x3cbutton class="btn btn-ghost btn-sm" data-del="${i}" aria-label="Remove line ${i+1}" title="Remove line ${i+1}">✕\x3c/button>
      \x3c/div>
    `).join('');
  }
  if(linesEl){
    renderE();
    linesEl.addEventListener('change', e=>{ const i=Number(e.target.dataset.i); if(e.target.classList.contains('e_svc')){ items[i].service_id=e.target.value; const svc=STATE.services.find(s=>s.id===e.target.value); if(svc) items[i].unit_price=Number(svc.default_price); renderE(); } });
    linesEl.addEventListener('input', e=>{ const i=Number(e.target.dataset.i); if(e.target.classList.contains('e_qty')) items[i].quantity=e.target.value; if(e.target.classList.contains('e_price')) items[i].unit_price=e.target.value; });
    linesEl.addEventListener('click', e=>{ if(e.target.dataset.del!=null){ items.splice(Number(e.target.dataset.del),1); if(!items.length) items.push({service_id:'',quantity:1,unit_price:0}); renderE(); }});
    document.getElementById('e_addLine').onclick=()=>{ items.push({service_id:'',quantity:1,unit_price:0}); renderE(); };
    document.getElementById('e_save').onclick=async ()=>{
      try{
        const payload={customer_id: document.getElementById('e_customer').value, purchase_at: document.getElementById('e_at').value, note: document.getElementById('e_note').value, redeem_points: document.getElementById('e_redeem').checked, items: items.map(l=>({service_id:l.service_id, quantity:Number(l.quantity), unit_price:Number(l.unit_price)})) };
        await call('apiEditPurchase', id, payload); await refresh(); location.hash='#purchase/'+id; alert('Saved');
      }catch(e){ document.getElementById('e_msg').innerHTML='\x3cdiv class="error">'+e+'\x3c/div>'; }
    };
    document.getElementById('evUpload').onclick=async ()=>{
      const f=document.getElementById('evFile').files[0]; if(!f) return alert('Select file');
      const b64=await toBase64(f); try{ await call('apiUploadEvidence', id, f.name, f.type, b64); await refresh(); location.hash='#purchase/'+id; }catch(e){ document.getElementById('evMsg').innerHTML='\x3cdiv class="error">'+e+'\x3c/div>'; }
    };
    const _evRemove=document.getElementById('evRemove'); if(_evRemove) _evRemove.addEventListener('click', async ()=>{ if(!confirm('Remove evidence?')) return; await call('apiRemoveEvidence', id); await refresh(); location.hash='#purchase/'+id; });
  }
}

      \x3cdiv style="font-size:13px;line-height:1.7">\x3cb>เลขที่:\x3c/b> ${p.receipt_number}\x3cbr>\x3cb>วันที่:\x3c/b> ${dt(p.purchase_at)}\x3cbr>\x3cb>ลูกค้า:\x3c/b> ${c?c.name:'—'}\x3cbr>\x3cb>รหัส:\x3c/b> ${c?c.customer_code:'—'}\x3c/div>
      \x3cdiv style="border-top:1px dashed var(--border);margin:16px 0">\x3c/div>
      \x3ctable style="font-size:13px;width:100%">\x3cthead>\x3ctr>\x3cth>รายการ\x3c/th>\x3cth>จำนวน\x3c/th>\x3cth>ราคา\x3c/th>\x3cth>รวม\x3c/th>\x3c/tr>\x3c/thead>\x3ctbody>${items.map(it=> `\x3ctr>\x3ctd>${it.service_name}\x3c/td>\x3ctd>${it.quantity}\x3c/td>\x3ctd>${money(it.unit_price)}\x3c/td>\x3ctd>${money(it.line_total)}\x3c/td>\x3c/tr>`).join('')}\x3c/tbody>\x3c/table>
      \x3cdiv style="border-top:1px dashed var(--border);margin:16px 0">\x3c/div>
      \x3cdiv style="font-size:13px">\x3cdiv style="display:flex;justify-content:space-between">\x3cspan>ยอดรวม\x3c/span>\x3cspan class="mono">${money(p.subtotal)}\x3c/span>\x3c/div>${Number(p.discount_amount)>0 ? '\x3cdiv style="display:flex;justify-content:space-between;color:var(--ok)">\x3cspan>ส่วนลดสะสมแต้ม\x3c/span>\x3cspan class="mono">-'+money(p.discount_amount)+'\x3c/span>\x3c/div>' : ''}\x3cdiv style="display:flex;justify-content:space-between;font-weight:700;margin-top:6px">\x3cspan>ยอดสุทธิ\x3c/span>\x3cspan class="mono">${money(p.total_amount)}\x3c/span>\x3c/div>\x3c/div>
       \x3cp style="text-align:center;font-size:12px" class="muted">ใช้แต้ม ${p.points_used} · ได้แต้ม ${p.points_earned} · ยอดคงเหลือปัจจุบัน ${bal}\x3c/p>
      ${p.status==='cancelled' ? '\x3cp style="text-align:center;color:var(--danger);font-weight:700">ยกเลิกใบเสร็จแล้ว\x3c/p>' : ''}
      \x3cp style="text-align:center;font-size:12px">${STATE.receipt_footer||'ขอบคุณที่ใช้บริการครับ'}\x3c/p>

function downloadReceiptPdf(){
  const el=document.getElementById('receipt');
  const w=window.open('','_blank'); w.document.write('\x3chtml>\x3chead>\x3ctitle>receipt\x3c/title>\x3cstyle>body{font-family:sans-serif;padding:20px}\x3c/style>\x3c/head>\x3cbody>'+el.outerHTML+'\x3c/body>\x3c/html>'); w.document.close(); w.print();
}

function bindSettings(){
  document.getElementById('s_save').onclick=async ()=>{
    const payload={store_name: document.getElementById('s_name').value, receipt_footer: document.getElementById('s_footer').value};
    const f=document.getElementById('s_logo').files[0];
    if(f){ payload.logoBase64=await toBase64(f); payload.logoMime=f.type; }
    try{ await call('apiSaveSettings', payload); document.getElementById('s_msg').textContent='Saved'; await refresh(); }catch(e){ alert(e); }
  };
}

// init
(function(){
  const h=location.hash; if(!h) location.hash='#dashboard';
  document.addEventListener('click', e=>{
    if(e.target.id==='h_search'){ FILTER.q=document.getElementById('h_q').value; FILTER.status=document.getElementById('h_status').value; FILTER.customer=document.getElementById('h_customer').value; render(); }
    if(e.target.id==='h_csv'){
      const rows=[['เลขที่ใบเสร็จ','ลูกค้า','วันที่','ยอดสุทธิ','สถานะ']];
      STATE.purchases.forEach(p=>{ const c=STATE.customers.find(x=>String(x.id)===String(p.customer_id)); rows.push([p.receipt_number,c?c.name:'', p.purchase_at, p.total_amount, p.status]); });
      const csv=rows.map(r=> r.map(x=> '"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
      const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='purchases.csv'; a.click();
      call('apiRecordExport','purchase_history',{count:rows.length-1});
    }
  });
  window.onerror=(m)=> console.error(m);
  updateClock(); setInterval(updateClock,1000);
  refresh().catch(e=> document.getElementById('app').innerHTML='\x3cdiv class="error">'+e+'\x3c/div>');
  const origRender=render;
  window.render=()=>{ origRender(); const h=location.hash; if(h.startsWith('#purchase/')) afterPurchase(h.split('/')[1]); };
})();
