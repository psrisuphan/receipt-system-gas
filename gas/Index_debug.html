<!DOCTYPE html>
<html><head><meta charset="utf-8"><title><?= storeName ?></title></head><body>
<h1><?= storeName ?> - Debug</h1>
<div id="app">กำลังโหลด...</div>
<pre id="log" style="white-space:pre-wrap;background:#f5f5f5;padding:10px"></pre>
<script>
function log(m){ document.getElementById('log').textContent += m + "\n"; console.log(m); }
log("JS start, calling apiGetInit...");
google.script.run
  .withSuccessHandler(function(r){
    log("apiGetInit OK: customers=" + r.customers.length + " purchases=" + r.purchases.length);
    document.getElementById('app').innerHTML = "<b>Loaded:</b> " + r.customers.length + " customers, " + r.purchases.length + " purchases<br>store: " + r.store_name;
    log(JSON.stringify(r, null, 2).slice(0,2000));
  })
  .withFailureHandler(function(e){
    log("apiGetInit FAIL: " + (e && e.message ? e.message : e));
    document.getElementById('app').innerHTML = '<span style="color:red">FAIL: ' + e + '</span>';
  })
  .apiGetInit();
</script>
</body></html>
